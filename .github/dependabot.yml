# Keep the GitHub Actions used in the workflows up to date.
# See https://docs.github.com/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # a single pull request for all action updates instead of one per action
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    # a single pull request for all dependency updates instead of one per package
    groups:
      python-dependencies:
        patterns:
          - "*"
    # pyvista pins its own version exactly (pyvista-validation==0.2.2 in pyvista 0.49.1), it moves with pyvista
    ignore:
      - dependency-name: "pyvista-validation"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
