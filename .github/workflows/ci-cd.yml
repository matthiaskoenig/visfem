name: CI-CD

on:
  push:
    # feature branches are tested through their pull request, tags release
    branches: [develop, main]
    tags: ['*']
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

# least privilege by default, the publish, release and sync jobs raise what they need
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # superseded branch runs are cancelled, release runs are never cancelled
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# The actions are pinned to commits, dependabot keeps them up to date; a moved
# tag of a compromised action cannot reach the jobs which publish the release.
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # the only supported python on every platform;
        # python 3.15 joins once vtk publishes wheels for it
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.14"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Install uv and set the python version
      # the cache is disabled on tag runs, see enable-cache
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2  # zizmor: ignore[cache-poisoning]
      with:
        python-version: ${{ matrix.python-version }}
        # a release run starts from a clean cache, a poisoned cache cannot reach it
        enable-cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
    - name: Set up a headless display
      # the app tests render on an off-screen plotter, which needs OpenGL: Mesa
      # with Xvfb on linux, the Mesa off-screen renderer on windows
      uses: pyvista/setup-headless-display-action@c103a2ff45650d38cb71684b5dc6cdfeb9442c79  # v5.1.0
    - name: Test with tox
      # the durations keep slow tests visible
      run:
        uvx --with tox-uv tox -e py${{ matrix.python-version }} -- --durations=15

  tests:
    # the one check the branch protection requires; the names of the matrix
    # jobs change with the matrix, this name does not
    name: tests
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Check the result of the test matrix
      env:
        RESULT: ${{ needs.test.result }}
      run: |
        echo "test matrix: $RESULT"
        test "$RESULT" = "success"

  build:
    # builds the distributions without any permission, the publish job only
    # uploads what was built here
    needs: tests
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
      with:
        python-version: "3.14"
    - name: Check the tag is the version of the package
      env:
        TAG: ${{ github.ref_name }}
      run: |
        version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/visfem/__init__.py)
        echo "tag: $TAG, version: $version"
        test "$TAG" = "$version"
    - name: Check the release notes exist
      env:
        TAG: ${{ github.ref_name }}
      run: test -f "release-notes/$TAG.md"
    - name: Build package
      run: uv build
    - name: Check the package
      run: uvx twine check dist/*
    - name: Upload the distributions
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: dist
        path: dist/
        if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/visfem
    permissions:
      id-token: write  # trusted publishing to PyPI, nothing else
    steps:
    - name: Download the distributions
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
      with:
        name: dist
        path: dist/
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
      with:
        packages-dir: dist

  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # create the GitHub release
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Create GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "release-notes/$TAG.md"

  sync-main:
    # main tracks the latest published release, see docs/development.md
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # fast-forward main to the released commit
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1  # zizmor: ignore[artipacked]
      with:
        # a shallow clone cannot be pushed to another branch; the credentials
        # are kept on purpose, the next step pushes with them
        fetch-depth: 0
    - name: Fast-forward main to the release
      # no --force: the push fails loudly if it would not be a fast-forward
      run: git push origin HEAD:main
