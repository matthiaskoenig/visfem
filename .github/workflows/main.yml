name: CI-CD

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # a newer run supersedes the running one of the same branch;
  # a release is never superseded, every tag is a group of its own
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # the newest python on every platform, the oldest supported python on linux
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.14"]
        include:
          - os: ubuntu-latest
            python-version: "3.13"

    steps:
    - uses: actions/checkout@v6
    - name: Install uv and set the python version
      uses: astral-sh/setup-uv@v7
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true
        # the interpreter is cached with the packages instead of downloaded by every run
        cache-python: true
    - name: Test with tox
      # the durations keep slow tests visible
      run:
        uvx --with tox-uv tox -e py${{ matrix.python-version }} -- --durations=15

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.14"]
    environment:
      name: pypi
      url: https://pypi.org/p/visfem
    permissions:
      id-token: write
      contents: write
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Get tag
      id: tag
      run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install hatch twine

    - name: Build package
      run: hatch build
    - name: Check the package
      run: twine check dist/*
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: dist
    - name: Create GitHub release
      uses: softprops/action-gh-release@v2
      with:
        body_path: "release-notes/${{ github.ref_name }}.md"
        draft: false
        prerelease: false
