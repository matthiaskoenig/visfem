name: Ruff
on: [push]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # a newer run supersedes the running one of the same branch
  cancel-in-progress: true

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      # Same ruff version as uv.lock and .pre-commit-config.yaml, so local
      # and CI formatting agree.
      - name: Lint
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.6"
      - name: Check formatting
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.6"
          args: "format --check"
