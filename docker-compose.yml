# Build
#  Dependency export
#    uv export --frozen --no-dev --no-editable -o setup/requirements.txt
#  Image build
#    docker compose up --build

# Environment variables
# TRAME_USE_HOST: sessionURL host for a reverse proxy or another hostname; a value containing :// replaces the whole ws://USE_HOST prefix
# TRAME_USER_DATA: container path whose owner UID/GID the unprivileged trame-user takes over, for mounted host directories owned by another user
# TRAME_URL_PREFIX: sub-path the content is served from (e.g. /app); default /
# TRAME_LAUNCHER_TIMEOUT: seconds to wait for a session to start (default 25)

services:
  visfem:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    restart: unless-stopped
    volumes:
      - ./data:/data:ro
    environment:
      TRAME_USER_DATA: /data   # trame-user takes over this path's owner UID/GID
      DATA_DIR: /data
