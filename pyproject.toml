[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "visfem"
dynamic = ["version"]
description = "VisFEM: Web visualization of FEM models"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
	{name="Michelle Elias", email="michelleelias66@gmail.com"},
	{name="Matthias König", email="konigmatt@googlemail.com"}
]
maintainers = [
	{name="Matthias König", email="konigmatt@googlemail.com"}
]
classifiers = [
	"Development Status :: 4 - Beta",
	"Intended Audience :: Science/Research",
	"Operating System :: OS Independent",
    "Programming Language :: Python :: 3.14",
	"Programming Language :: Python :: Implementation :: CPython",
	"Topic :: Scientific/Engineering",
	"Topic :: Scientific/Engineering :: Bio-Informatics",
]
keywords = [
	"modeling",
	"visualization",
	"FEM",
]
dependencies = [
	"rich>=15.0.0",
	"pydantic>=2.14.1",
	"meshio>=5.3.5",
	"pyvista>=0.49.1",
	"vtk>=9.7.1",
	"trame>=4.0.0",
	"trame-client>=4.1.4",  # trame_client.widgets.client
	"trame-vuetify>=3.3.0",
	"trame-vtk>=2.11.17",
	"h5py>=3.16.0",
	"numpy>=2.5.4",
]

[project.optional-dependencies]
dev = [
    "bump-my-version>=1.6.7",
    "ruff>=0.17.2",
    "pre-commit>=4.7.0",
    "ty>=0.0.92",
    "tox>=4.67.1",
    "tox-uv>=1.37.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "zensical>=0.0.72",
    "mkdocstrings-python>=2.0.10",
    "ipykernel>=7.4.0",  # kernel for notebooks/visfem.ipynb
]

[project.urls]
Homepage = "https://visfem.de"
Documentation = "https://visfem.de/docs/"
Repository = "https://github.com/matthiaskoenig/visfem"
Issues = "https://github.com/matthiaskoenig/visfem/issues"
Changelog = "https://github.com/matthiaskoenig/visfem/tree/develop/release-notes"
Download = "https://pypi.org/project/visfem"

[tool.hatch.version]
path = "./src/visfem/__init__.py"

[tool.hatch.build.targets.sdist]
# the source distribution holds what is needed to build, test and document the
# package; not the deployment, the notebooks, the CI configuration or the lock file
include = [
    "/src",
    "/tests",
    "/docs",
    "/scripts",
    "/release-notes",
    "/README.md",
    "/LICENSE",
    "/CITATION.cff",
    "/zensical.toml",
    "/tox.ini",
    "/.ruff.toml",
]

[project.scripts]
visfem = "visfem.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
# a warning is a failure, the tests keep the code free of deprecated calls
filterwarnings = ["error"]

[tool.ty.environment]
# first-party modules live in the src layout; the checked python version is
# inferred from `project.requires-python` (i.e. the oldest supported version)
root = ["./src", "."]  # "." resolves the helpers of the tests package

[tool.ty.src]
include = ["src", "tests", "scripts"]

[tool.ty.terminal]
# warnings are failures: keep the codebase free of any diagnostic
error-on-warning = true
