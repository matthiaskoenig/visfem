[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "visfem"
dynamic = ["version"]
description = "VisFEM: Web visualization of FEM models"
readme = "README.md"
requires-python = ">=3.13"
authors = [
	{name="Michelle Elias", email="michelleelias66@gmail.com"},
	{name="Matthias König", email="konigmatt@googlemail.com"}
]
maintainers = [
	{name="Matthias König", email="konigmatt@googlemail.com"}
]
classifiers = [
	"Development Status :: 4 - Beta",
	"Intended Audience :: Science/Research",
	"License :: OSI Approved :: MIT License",
	"Operating System :: OS Independent",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
	"Programming Language :: Python :: Implementation :: CPython",
	"Topic :: Scientific/Engineering",
	"Topic :: Scientific/Engineering :: Bio-Informatics",
]
keywords = [
	"modeling",
	"visualization",
	"FEM",
]
dependencies = [
	"rich>=13.0",
	"pydantic>=2.0",
	"meshio>=5.3",
	"pyvista>=0.47",  # extract_surface(algorithm=...)
	"vtk>=9.2.2",
	"trame>=4.0",
	"trame-client>=4.1",  # trame_client.widgets.client
	"trame-vuetify>=3.2",
	"trame-vtk>=2.11",
	"h5py>=3.0",
	"numpy>=2.0",
]

[project.optional-dependencies]
dev = [
    "bump-my-version>=1.6.6",
    "ruff>=0.17.2",
    "pre-commit>=4.7.0",
    "ty>=0.0.91",
    "tox>=4.67.1",
    "tox-uv>=1.37.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "zensical>=0.0.72",
    "mkdocstrings-python>=2.0.10",
    "ipykernel>=7.0",  # kernel for notebooks/visfem.ipynb
]

[project.urls]
Homepage = "https://github.com/matthiaskoenig/visfem"
Repository = "https://github.com/matthiaskoenig/visfem"
Documentation = "https://github.com/matthiaskoenig/visfem"
Issues = "https://github.com/matthiaskoenig/visfem/issues"
Download = "https://pypi.org/project/visfem"

[tool.hatch.version]
path = "./src/visfem/__init__.py"

[tool.hatch.build.targets.sdist]
exclude = [
	"/.github",
	"/.zenodo.json",
	"/DEPLOYMENT.md",
	"/Dockerfile",
	"/RELEASE.md",
	"/compose.deploy.yml",
	"/data/datasets/.gitignore",
	"/deploy",
	"/docker-compose.yml",
	"/docs",
	"/notebooks",
	"/release-notes",
	"/setup",
]

[project.scripts]
visfem = "visfem.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.environment]
# first-party modules live in the src layout; the checked python version is
# inferred from `project.requires-python` (i.e. the oldest supported version)
root = ["./src"]

[tool.ty.src]
include = ["src", "tests", "scripts"]

[tool.ty.terminal]
# warnings are failures: keep the codebase free of any diagnostic
error-on-warning = true
