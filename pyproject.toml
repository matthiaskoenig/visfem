[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "visfem"
dynamic = ["version"]
description = "VisFEM: Web visualization of FEM models"
readme = "README.md"
requires-python = ">=3.13"
authors = [
	{name="Michelle Elias", email="michelleelias66@gmail.com"},
	{name="Matthias König", email="konigmatt@googlemail.com"}
]
maintainers = [
	{name="Matthias König", email="konigmatt@googlemail.com"}
]
classifiers = [
	"Development Status :: 4 - Beta",
	"Intended Audience :: Science/Research",
	"License :: OSI Approved :: MIT License",
	"Operating System :: OS Independent",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
	"Programming Language :: Python :: Implementation :: CPython",
	"Topic :: Scientific/Engineering",
	"Topic :: Scientific/Engineering :: Bio-Informatics",
]
keywords = [
	"modeling",
	"visualization",
	"FEM",
]
dependencies = [
	"rich>=13.0",
	"pydantic>=2.0",
	"meshio>=5.3",
	"pyvista>=0.47",  # extract_surface(algorithm=...)
	"vtk>=9.2.2",
	"trame>=3.12",
	"trame-client>=3.12.2",
	"trame-vuetify>=3.2",
	"trame-vtk>=2.11",
	"h5py>=3.0",
	"numpy>=2.0",
]

[project.optional-dependencies]
dev = [
    "bump-my-version>=1.2.4",
	"ruff>=0.14.0",
	"pre-commit>=4.0.1",
	"mypy>=1.18.2",
    "tox>=4.31.0",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "ipykernel>=7.0",  # kernel for notebooks/visfem.ipynb
]

[project.urls]
Homepage = "https://github.com/matthiaskoenig/visfem"
Repository = "https://github.com/matthiaskoenig/visfem"
Documentation = "https://github.com/matthiaskoenig/visfem"
Issues = "https://github.com/matthiaskoenig/visfem/issues"
Download = "https://pypi.org/project/visfem"

[tool.hatch.version]
path = "./src/visfem/__init__.py"

[tool.hatch.build.targets.sdist]
exclude = [
	"/.github",
	"/.zenodo.json",
	"/DEPLOYMENT.md",
	"/Dockerfile",
	"/RELEASE.md",
	"/compose.deploy.yml",
	"/data/datasets/.gitignore",
	"/deploy",
	"/docker-compose.yml",
	"/docs",
	"/notebooks",
	"/release-notes",
	"/setup",
]

[project.scripts]
visfem = "visfem.cli:main"

[tool.mypy]
disable_error_code = ["import-not-found"]
