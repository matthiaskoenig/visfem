[tox]
# python 3.15 joins once vtk publishes wheels for it
envlist = ty, py3.14

[testenv]
package = wheel
wheel_build_env = .pkg
deps =
    pytest
commands =
    pytest {posargs}

[testenv:ty]
# the versions of ty and the stubs come from uv.lock (the dev extra), so the
# check only changes with a dependency update, not with a new release of ty
runner = uv-venv-lock-runner
extras =
    dev
passenv =
    TY_OUTPUT_FORMAT
commands =
    ty check
